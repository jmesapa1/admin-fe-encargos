<div class="modal-header">
  <h4 class="modal-title">Agregar pago a compra</h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.close('Close click')"></button>
</div>
<div class="modal-body">
  <h4>{{pedido.compraData.compra.purchases.items[0].name}}</h4>
  <div class="row">
    <div class="col-md-12">
      <form [formGroup]="pagoForm">
        <div class="form-group row">
          <label for="inputValor" class="col-sm-3 col-form-label">Medio de pago</label>
          <div class="col-sm-9">
            <select formControlName="idMedioPago" required class="form-control" id="inputValor" required placeholder="Ingresar valor">
              <option value="" selected="true" disabled="disabled">Seleccione una opción</option>
              <option value="2">Bancolombia</option>
              <option value="17">NEQUI</option>
              <option value="12">NU BANK</option>
              <option value="18">Tarjeta de credito DIEGO</option>
              <option value="13">Popular</option>

            </select>
          </div>
        </div>
        <div class="form-group row">
          <label for="inputValor" class="col-sm-3 col-form-label">Valor</label>
          <div class="col-sm-9">
            <input currencyMask  [options]="{ prefix: '$ ', thousands: '.', decimal: ',',precision:0 }" type="text"
              formControlName="valor" class="form-control" id="inputValor" placeholder="Ingresar valor" />
              <small>Maximo ${{pedido.saldo | number}} </small>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
<p class="px-3" role="status" *ngIf="envio.enviando">Procesando pago…</p>
<div class="modal-footer">
  <button type="button" class="btn btn-outline-secondary" (click)="activeModal.close('Close click')">Cerrar</button>
  <button type="button" class="btn btn-primary" [disabled]="this.pagoForm.invalid" (click)="agregarPago()">Abonar</button>

</div>
